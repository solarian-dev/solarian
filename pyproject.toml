[project]
name = "proto"
version = "0.1.0"
description = "A robotics framework for the modern world."
authors = [
    {name = "Raul Garreta",email = "rgarreta@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch (>=2.2.1)",
    "pyzmq (>=26.4.0,<27.0.0)",
    "opencv-python (>=4.12.0.88,<5.0.0.0)",
    "ultralytics (>=8.3.124,<9.0.0)",
    "tqdm (>=4.67.1,<5.0.0)",
    "numpy (>=1.21.0)",
    "msgpack (>=1.1.0,<2.0.0)",
    "gymnasium==0.29.1",
    "mujoco (>=3.3.2,<4.0.0)",
    "hydra-core (>=1.3.2,<2.0.0)",
    "lerobot (>=0.1,<0.2)",
    "pydantic (>=2.11.4,<3.0.0)",
    #"openpi_client @ git+https://github.com/Physical-Intelligence/openpi.git#subdirectory=packages/openpi-client",
    "pynput>=1.7.7",
    "feetech-servo-sdk>=1.0.0",
    "dynamixel-sdk>=3.7.31",
    "pydantic-settings>=2.9.1",
    "dm_control==1.0.30",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
