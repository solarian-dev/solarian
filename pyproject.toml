[project]
name = "solarian"
version = "0.5.0"
description = "A robotics framework for the modern world."
authors = [
    {name = "Raul Garreta", email = "raul@solarian.dev"}
]
readme = "README.md"
license = {text = "Apache-2.0"}
classifiers = ["License :: OSI Approved :: Apache Software License"]
requires-python = ">=3.10"
dependencies = [

    # Communication
    "pyzmq==26.4.0",
    "msgpack==1.1.0",
    # WebSocket server behind ``ui=external`` (solarian/core/ui/external.py).
    "websockets>=13",
    # The macOS wheels fail at dlopen on Apple Silicon. That platform builds
    # atomics from source during install (solarian_build / ensure_atomics).
    "atomics==1.0.3; sys_platform != 'darwin' or platform_machine != 'arm64'",

    # Data input, validation and settings
    "pynput>=1.7.7",
    "pygame>=2.6",
    "hydra-core==1.3.2",
    "pydantic_core==2.33.2",
    "pydantic-settings==2.9.1",
    "jinja2>=3.1",
    "tqdm",
    "colorama",
    "screeninfo",
    "rich==14.1.0",
    "ipython",

    # Policy serving over HTTP (PolicyServer / PolicyClient live in core, so
    # their serving + client + checkpoint-loading deps ship with the framework
    # and plugins don't have to re-declare them).
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "requests>=2.31",
    "dill>=0.3.7",

    # Data processing
    "opencv-python==4.12.0.88",
    "numpy==2.2.6",
    "scipy>=1.15",
    "pandas",
    "pyarrow",
    "matplotlib",
    "plotly",
    "pillow",
    "imageio==2.34.0",
    "imageio-ffmpeg",
    # H.264 encoding of the episode archive (solarian/core/recording).
    "av>=14",

    # Other
    "cmake==4.0.3",
    "threadpoolctl==3.2",
]

[project.optional-dependencies]
ai = [
    "torch==2.8.0",
    "torchvision==0.23",
    "torchcodec==0.7; platform_machine != 'aarch64'",
    "datasets==3.6.0",
    "wandb>=0.22.3",
    "openai",
    # xformers is not listed here. Its sdist always passes -fopenmp, and
    # Apple clang rejects that, so a normal extra would fail the whole
    # install. solarian_build / ensure_xformers builds 0.0.32.post1 (the
    # release for torch==2.8.0) on Apple Silicon when this extra is installed.
]
# The agentic controller (`agent:` in conf/controller.yaml): the planner and monitor
# clients. No torch, so a controller laptop can run it without the training stack.
agent = [
    "anthropic>=0.76",
    "openai>=2.0",
    "httpx>=0.27",
]
sim = [
    "gymnasium==0.29.1",
    "mujoco==3.3.2",
    "dm_control==1.0.30",
    "mink==0.0.11",
    "robot_descriptions==3.0.0",
    # cad-import reads config.json that may contain comments.
    "commentjson>=0.9",
]
all = [
    "solarian[ai,agent,sim]",
]

[tool.uv]
# The macOS wheel fails at dlopen on Apple Silicon. Installs of Solarian build
# atomics from source there and do not depend on the wheel. If uv is asked for
# atomics anyway, build that from source too.
no-binary-package = ["atomics"]

[project.scripts]
solarian = "solarian.cli.manage:main"
create-solarian = "solarian.cli.scaffolder:create_project"


# ============================================================================
# Plugin Entry Points
# ============================================================================
# Third-party packages can register their own modules and actuator buses
# by declaring entry points in their pyproject.toml. Example:
#
#   [project.entry-points."solarian.modules"]
#   my_custom_arm = "my_package.modules:MyCustomArmModule"
#
#   [project.entry-points."solarian.actuator_buses"]
#   my_custom_bus = "my_package.buses:MyCustomBus"
# ============================================================================

# ============================================================================
# NOTE: Module plugins are now in separate packages:
#   - solarian-koch: pip install solarian-koch
#   - solarian-so100: pip install solarian-so100
#   - solarian-ur5: pip install solarian-ur5 (includes actuators, bus, and module)
#
# These plugins register themselves via entry points when installed.
# The core Solarian framework no longer includes built-in module implementations.
# ============================================================================

# ============================================================================
# NOTE: All modules are now in separate plugin packages:
#   - solarian-koch: pip install solarian-koch
#   - solarian-so100: pip install solarian-so100
#   - solarian-ur5-arm: pip install solarian-ur5-arm
#   - solarian-umi-evo: pip install solarian-umi-evo
#   - solarian-lekiwi: pip install solarian-lekiwi
#
# These plugins register themselves via entry points when installed.
# The core Solarian framework no longer includes built-in module implementations.
# ============================================================================

# ============================================================================
# NOTE: Actuator and bus plugins are now in separate packages:
#   - solarian-feetech: pip install solarian-feetech
#   - solarian-dynamixel: pip install solarian-dynamixel  
#   - solarian-ur5: pip install solarian-ur5 (includes actuators, bus, and module)
#
# These plugins register themselves via entry points when installed.
# The core Solarian framework no longer includes built-in actuator/bus implementations.
# ============================================================================


[tool.poetry]
packages = [{include = "solarian"}]
include = [
    {path = "solarian_build.py", format = "sdist"},
    {path = "solarian/data/**/*.json", format = ["sdist", "wheel"]},
    {path = "solarian/data/**/*.png", format = ["sdist", "wheel"]},
    # The docs pages, for `solarian docs`. solarian_build copies them into
    # solarian/_docs during a wheel build.
    {path = "docs/**/page.mdx", format = "sdist"},
    {path = "solarian/_docs/**/page.mdx", format = "wheel"},
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0", "pip"]
build-backend = "solarian_build"
backend-path = ["."]
