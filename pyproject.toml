[project]
name = "proto"
version = "0.1.0"
description = "A robotics framework for the modern world."
authors = [
    {name = "Raul Garreta",email = "rgarreta@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [

    

    # Communication
    "pyzmq==26.4.0",
    "msgpack==1.1.0",

    # Data input, validation and settings
    "pynput>=1.7.7",
    "hydra-core==1.3.2",
    "pydantic_core==2.33.2",
    "pydantic-settings==2.9.1",
    "tqdm",
    "colorama",
    "screeninfo",
    "rich==14.1.0",

    # Data processing
    "opencv-python==4.12.0.88",
    "ultralytics==8.3.179",
    "numpy==2.2.6",
    "pandas",
    "pyarrow",
    "matplotlib",
    "plotly",
    "pillow",
    "imageio==2.34.0",
    "imageio-ffmpeg",
    "einops==0.8.1",
    "easydict==1.13",

    # AI
    "torch==2.8.0",
    "torchcodec==0.7",
    "torchvision==0.23",
    "datasets==3.6.0",
    #"xformers==0.0.31.post1",
    
    # Simulation
    "gymnasium==0.29.1",
    "mujoco==3.3.2",
    "dm_control==1.0.30",

    # Hardware
    "feetech-servo-sdk>=1.0.0",
    "dynamixel-sdk>=3.7.31",
    "urx==0.11.0",
    "ur-rtde==1.5.6; platform_system != 'Darwin' or platform_machine != 'arm64'",

    # Logging
    "wandb>=0.22.3",

    # Other
    "cmake==4.0.3",
    "threadpoolctl==3.2",


    # "lerobot (>=0.1,<0.2)",
    # "openpi_client @ git+https://github.com/Physical-Intelligence/openpi.git#subdirectory=packages/openpi-client",
    
]

[project.scripts]
proto = "proto.management.manage:main"
create-proto = "proto.management.scaffolder:create_project"


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
