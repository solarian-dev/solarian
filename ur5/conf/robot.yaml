defaults:
    - connection: localhost
    - _self_
img_compression_quality: 70
fps: 30
# actuator_port: /dev/ttyACM1
actuator_port: 10.0.0.119
# front_camera_port: /dev/video0
# wrist_camera_port: /dev/video2
front_camera_port: '0'
wrist_camera_port: '1'
modules:  
    arm:
        type: ur5
        # calibration_file: .cache/calibration/lekiwi/robot_arm.json
        calibration_file: .cache/calibration/ur5/ur5.json
        bodies:
            base:
                mass: 1
                inertia: 1
            shoulder:
                mass: 1
                inertia: 1
            upper_arm:
                mass: 1
                inertia: 1
            lower_arm:
                mass: 1
                inertia: 1
            wrist1:
                mass: 1
                inertia: 1
            wrist2:
                mass: 1
                inertia: 1
            wrist3:
                mass: 1
                inertia: 1
                actuators:
                    x:
                        id: 0
                        model: ur5
                        port: ${actuator_port}
                        type: ur5_cartesian
                        mode: range_m100_100
                    y:
                        id: 1
                        model: ur5
                        port: ${actuator_port}
                        type: ur5_cartesian
                        mode: range_m100_100
                    z:
                        id: 2
                        model: ur5
                        port: ${actuator_port}
                        type: ur5_cartesian
                        mode: range_m100_100
                    rx:
                        id: 3
                        model: ur5
                        port: ${actuator_port}
                        type: ur5_cartesian
                        mode: range_m100_100
                    ry:
                        id: 4
                        model: ur5
                        port: ${actuator_port}
                        type: ur5_cartesian
                        mode: range_m100_100
                    rz:
                        id: 5
                        model: ur5
                        port: ${actuator_port}
                        type: ur5_cartesian
                        mode: range_m100_100
            # fixed_jaw:
            #     mass: 1
            #     inertia: 1
            #     sensors: []
            # moving_jaw:
            #     mass: 1
            #     inertia: 1
        joints:
            shoulder_pan:
                parent_body: base
                child_body: shoulder
                actuators:
                    shoulder_pan:
                        id: 0
                        model: ur5
                        port: ${actuator_port}
                        type: ur5_joint
                        mode: range_m100_100
                
            shoulder_lift:
                parent_body: shoulder
                child_body: upper_arm
                actuators:
                    shoulder_lift:
                        id: 1
                        model: ur5
                        port: ${actuator_port}
                        type: ur5_joint
                        mode: range_m100_100
            elbow_flex:
                parent_body: upper_arm
                child_body: lower_arm
                actuators:
                    elbow_flex:
                        id: 2
                        model: ur5
                        port: ${actuator_port}
                        type: ur5_joint
                        mode: range_m100_100
            wrist_flex:
                parent_body: lower_arm
                child_body: wrist1
                actuators:
                    wrist_flex:
                        id: 3
                        model: ur5
                        port: ${actuator_port}
                        type: ur5_joint
                        mode: range_m100_100
            wrist_yaw:
                parent_body: wrist1
                child_body: wrist2
                actuators:
                    wrist_yaw:
                        id: 4
                        model: ur5
                        port: ${actuator_port}
                        type: ur5_joint
                        mode: range_m100_100
            wrist_roll:
                parent_body: wrist2
                child_body: wrist3
                actuators:
                    wrist_roll:
                        id: 5
                        model: ur5
                        port: ${actuator_port}
                        type: ur5_joint
                        mode: range_m100_100
            