defaults:
    - connection: localhost
    - _self_
fps: 30
tps: 1
system2_model: gemini/gemini-1.5-flash
system2_prompt: Be a smart and helpful robot assistant.
# policy_path: /Users/raul/workspace/lerobot/outputs/train/act_lekiwi_pick_lego_block/checkpoints/006000/pretrained_model
policy_path: /Users/raul/workspace/lerobot/outputs/train/act_so100_5k/pretrained_model
device: mps
actuator_port: /dev/ttyACM1
# actuator_port: /dev/tty.usbmodem58FD0167771
modules:
    leader_arm:
        type: koch
        # calibration_file: .cache/calibration/lekiwi/leader_arm.json
        calibration_file: .cache/calibration/lekiwi2/lekiwi_leader_arm_translated.json
        gripper_open_degree: 35
        bodies:
            base:
                mass: 1
                inertia: 1
            shoulder:
                mass: 1
                inertia: 1
            upper_arm:
                mass: 1
                inertia: 1
            lower_arm:
                mass: 1
                inertia: 1
            wrist:
                mass: 1
                inertia: 1
            fixed_jaw:
                mass: 1
                inertia: 1
            moving_jaw:
                mass: 1
                inertia: 1
        joints:
            shoulder_pan:
                type: revolute
                axis: [0, 0, 1]
                parent_body: base
                child_body: shoulder
                actuators:
                    shoulder_pan:
                        id: 1
                        model: xl330-m077
                        port: ${actuator_port}
                        type: dynamixel
                        mode: range_m100_100
                
            shoulder_lift:
                type: revolute
                axis: [0, 1, 0]
                parent_body: shoulder
                child_body: upper_arm
                actuators:
                    shoulder_lift:
                        id: 2
                        model: xl330-m077
                        port: ${actuator_port}
                        type: dynamixel
                        mode: range_m100_100
            elbow_flex:
                type: revolute
                axis: [0, 1, 0]
                parent_body: upper_arm
                child_body: lower_arm
                actuators:
                    elbow_flex:
                        id: 3
                        model: xl330-m077
                        port: ${actuator_port}
                        type: dynamixel
                        mode: range_m100_100
            wrist_flex:
                type: revolute
                axis: [0, 1, 0]
                parent_body: lower_arm
                child_body: wrist
                actuators:
                    wrist_flex:
                        id: 4
                        model: xl330-m077
                        port: ${actuator_port}
                        type: dynamixel
                        mode: range_m100_100
            wrist_roll:
                type: revolute
                axis: [0, 0, 1]
                parent_body: wrist
                child_body: fixed_jaw
                actuators:
                    wrist_roll:
                        id: 5
                        model: xl330-m077
                        port: ${actuator_port}
                        type: dynamixel
                        mode: range_m100_100
            gripper:
                type: revolute
                axis: [0, 0, 1]
                parent_body: fixed_jaw
                child_body: moving_jaw
                actuators:
                    gripper:
                        id: 6
                        model: xl330-m077
                        port: ${actuator_port}
                        type: dynamixel
                        mode: range_m100_100