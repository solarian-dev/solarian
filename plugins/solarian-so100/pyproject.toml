[project]
name = "solarian-so100"
version = "0.1.0"
description = "SO100 follower arm module plugin for Solarian robotics framework"
authors = [
    {name = "Solarian Contributors", email = "solarian@example.com"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "solarian>=0.1.0",
    "solarian-feetech>=0.1.0",  # Uses Feetech servos
]

[project.entry-points."solarian.modules"]
so100_follower_arm = "solarian_so100.module:SO100FollowerArmModule"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

